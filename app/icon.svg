<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ballGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ff3333;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#cc0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="seamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#660000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow/base -->
  <circle cx="50" cy="50" r="45" fill="#770000" opacity="0.3"/>
  
  <!-- Main ball body -->
  <circle cx="50" cy="50" r="45" fill="url(#ballGradient)"/>
  
  <!-- Highlight -->
  <ellipse cx="35" cy="35" rx="12" ry="18" fill="#ff6666" opacity="0.4"/>
  
  <!-- Seam area background -->
  <ellipse cx="32" cy="50" rx="3" ry="45" fill="url(#seamGradient)"/>
  
  <!-- Top seam line -->
  <path d="M 25 25 Q 32 35, 32 50 Q 32 65, 25 75" 
        fill="none" 
        stroke="white" 
        stroke-width="1.5" 
        stroke-dasharray="2,2"
        opacity="0.9"/>
  
  <!-- Bottom seam line -->
  <path d="M 39 25 Q 32 35, 32 50 Q 32 65, 39 75" 
        fill="none" 
        stroke="white" 
        stroke-width="1.5" 
        stroke-dasharray="2,2"
        opacity="0.9"/>
  
  <!-- Seam stitching detail -->
  <circle cx="29" cy="35" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="35" cy="40" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="29" cy="50" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="35" cy="60" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="29" cy="65" r="0.8" fill="white" opacity="0.7"/>
</svg>

